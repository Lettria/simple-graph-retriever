[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-graph-retriever"
version = "1.0.0rc14"
authors = [
  { name="Victor de La Salmonière", email="victor@lettria.com" },
]
description = "A simple graph-based retriever using Neo4j and Qdrant"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "qdrant-client==1.11.0",
    "requests",
    "tqdm",
    "igraph",
    "leidenalg",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
neo4j = ["neo4j"]
falkordb = ["falkordb"]
# Convenience option to install everything
all = ["neo4j", "falkordb"]

[tool.hatch.build.targets.wheel]
packages = ["simple_graph_retriever"]